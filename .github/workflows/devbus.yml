name: devbus-observer
on:
  pull_request:
  push:
    branches: [main]
jobs:
  devbus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned observer and browser dependencies
        run: |
          python -m pip install -r requirements-web.lock -r requirements-devbus.lock httpx==0.28.1 playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Disposable local NATS server
        run: |
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.15.0/nats-server-v2.15.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/nats.tar.gz"
          echo "5d2c51caca950333aba84911df7d377f826f3a59ec36061c6539105084f65c92  $RUNNER_TEMP/nats.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nats.tar.gz" -C "$RUNNER_TEMP"
          echo "CONTROL_DEVBUS_NATS_TEST_SERVER=$RUNNER_TEMP/nats-server-v2.15.0-linux-amd64/nats-server" >> "$GITHUB_ENV"
      - name: Observer, owner API, real JetStream and component contracts
        run: |
          python -m unittest discover -s tests -p 'test_control_web_devbus*.py'
          python -m py_compile bin/_control_web_devbus.py bin/_control_web_devbus_nats.py
