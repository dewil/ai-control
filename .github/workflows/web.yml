name: web-contract
on:
  push:
    branches: [main]
  pull_request:
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Signed deploy bootstrap fixtures read the immutable accepted Git snapshot.
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pinned web dependencies
        run: |
          python -m pip install -r requirements-web.lock -r requirements-devbus.lock
          python -m pip install httpx==0.28.1
      - name: Install pinned browser test tooling
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Disposable local NATS server
        run: |
          curl -fsSL https://github.com/nats-io/nats-server/releases/download/v2.15.0/nats-server-v2.15.0-linux-amd64.tar.gz -o "$RUNNER_TEMP/nats.tar.gz"
          echo "5d2c51caca950333aba84911df7d377f826f3a59ec36061c6539105084f65c92  $RUNNER_TEMP/nats.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nats.tar.gz" -C "$RUNNER_TEMP"
          echo "CONTROL_DEVBUS_NATS_TEST_SERVER=$RUNNER_TEMP/nats-server-v2.15.0-linux-amd64/nats-server" >> "$GITHUB_ENV"
      - name: Existing trusted writer prerequisite
        run: |
          yq_download=$(mktemp "$RUNNER_TEMP/control-web-yq.XXXXXX")
          trap 'rm -f "$yq_download"' EXIT
          curl -fsSL -o "$yq_download" https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          printf '%s  %s\n' 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4' "$yq_download" | sha256sum -c -
          sudo install -m 0755 "$yq_download" /usr/local/bin/yq
      - name: Permanent Android publication boundary contracts
        run: python -m unittest discover -s tests -p 'test_control_android_publish*.py'
      - name: Web boundary contracts and writer integration
        # test_current16_startup_boundary_at_reviewed_UX_revision covers the
        # immutable UX-only deployment boundary inside this discovery.
        # All behavior tests execute this actual LIVE/BUS checkout; never replace
        # it with the old UX snapshot. Reject working-tree/untracked drift.
        env:
          CONTROL_LIVE_UX_SCOPE_REVISION: 73eb36b4eba7b13b893014e400b30b7f918de986
          CONTROL_LIVE_UX_QA_REPO: ${{ github.workspace }}
        run: |
          git diff --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          python -m unittest discover -s tests -p 'test_control_web*.py'
          python -m unittest discover -s tests -p 'test_ai_control_names.py'
          python -m py_compile bin/_control_web.py bin/_control_web_live.py bin/_control_web_broker.py bin/_control_web_sessions.py bin/_codex_rc.py bin/ai-control-web
      - name: Provider account binding and runtime admission
        run: |
          python tests/test-provider-accounts.py
          python tests/test-provider-account-binding.py
          python tests/test-provider-account-config-pointer.py
          python tests/test-provider-account-lower-admission.py
          python tests/test-provider-profile-registration.py
          python tests/test-provider-profile-publication.py
          python tests/test-provider-profile-capture-reference.py
          python tests/test-provider-profile-sticky-ancestor.py
          python tests/test-provider-profile-cli.py
          python tests/test-provider-task-publication-guard.py
          python tests/test-provider-publication-committed-outcome.py
          bash tests/test-agent-io.sh
          python tests/test-codex-task-runtime.py
      - name: Signed deployment boundary and recovery
        run: |
          python tests/test-web-universal-deploy.py
          python -m py_compile deployment/ai-control-web-deploy.py
      - name: Installation regression
        run: |
          # These install tests mock launchd; they need an inert CLI prerequisite,
          # not a Claude account or a runnable agent on the hosted runner.
          fixture_bin=$(mktemp -d "$RUNNER_TEMP/control-web-install.XXXXXX")
          cat > "$fixture_bin/claude" <<'STUB'
          #!/bin/sh
          if [ "${1:-}" = --version ]; then
            echo 'Claude inert installation fixture'
            exit 0
          fi
          exit 99
          STUB
          chmod 700 "$fixture_bin/claude"
          export CLAUDE_BIN="$fixture_bin/claude"
          bash tests/test-install-completeness.sh
          bash tests/test-install-idempotent.sh
          bash tests/test-install-macos-legacy.sh
